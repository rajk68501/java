apiVersion: v1
kind: Service
metadata:
  name: java-app-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-role: elb
    # Replace these subnet IDs with your actual subnets
    service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-XXXXXX,subnet-YYYYYY
spec:
  selector:
    app: java-app
  ports:
    - protocol: TCP
      port: 80            # External port
      targetPort: 8081   # Container port your Java app listens on
  type: LoadBalancer
